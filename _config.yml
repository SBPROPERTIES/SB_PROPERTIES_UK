# GitHub Pages branch builds use Jekyll. Publish only website content.
# For artifact-based deployments, use tools/build_public_site.py instead.
exclude:
  - Search-Data
  - research
  - tmp
  - dist
  - error.log
  - add_whatsapp.py
  - fix_blog_paths.js
  - fix_header_css.py
  - update_headers.py
  - tools/*.py
  - tools/__pycache__
  - README.md
  - AGENTS.md
